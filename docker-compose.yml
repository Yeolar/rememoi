# Fixed project name: compose otherwise derives it from the directory name,
# so two apps whose folders share a basename would collide on container and
# network names.
name: rememoi

services:
  rememoi:
    image: rememoi:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://rememoi.com}
    restart: unless-stopped
    # Keep container logs from filling the disk on a small VM.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env.production
    ports:
      # Caddy runs on the host and connects through this loopback port.
      - "127.0.0.1:3010:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
