services:
  rememoi:
    image: rememoi:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://rememoi.com}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # Caddy runs on the host and connects through this loopback port.
      - "127.0.0.1:3010:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
